name: Compilar controlador Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Dependencias y tests
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt pyinstaller
          python -m unittest discover -s tests -v
      - name: Generar EXE independiente (sin Python instalado en el equipo final)
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name ControladorChatGPT --hidden-import=win32timezone --collect-submodules=pywinauto --add-data "wake_task.ps1;." controller.py
      - name: Crear paquete instalable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bundle/ControladorChatGPT | Out-Null
          Copy-Item *.py,*.bat,*.ps1,*.txt,*.md -Destination bundle/ControladorChatGPT -ErrorAction Stop
          Copy-Item dist/ControladorChatGPT.exe -Destination bundle/ControladorChatGPT/
          Copy-Item Actualizar_Autochatty_a_v6.exe -Destination bundle/ControladorChatGPT/
          Copy-Item tests -Recurse -Destination bundle/ControladorChatGPT/
          Copy-Item build_native -Recurse -Destination bundle/ControladorChatGPT/
          Compress-Archive -Path bundle/ControladorChatGPT -DestinationPath Controlador_ChatGPT_Windows_v6_Compilado.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Controlador-ChatGPT-Windows-v6
          path: Controlador_ChatGPT_Windows_v6_Compilado.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Ejecutables-Windows
          path: |
            dist/ControladorChatGPT.exe
            Actualizar_Autochatty_a_v6.exe
      - name: Publicar ejecutables en Releases para etiquetas v*
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" Controlador_ChatGPT_Windows_v6_Compilado.zip dist/ControladorChatGPT.exe Actualizar_Autochatty_a_v6.exe --title "Controlador ChatGPT ${{ github.ref_name }}" --notes "Versión experimental. Ver LEEME.md; requiere sesión Windows desbloqueada para interactuar con la app." --verify-tag
